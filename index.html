<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLib Catalogue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <h1 class="site-title">BlueLib Catalogue</h1>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="#catalogue">Catalogue</a>
                <a href="#add-book">Add Book</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- Catalogue: search, filter and book cards -->
        <section id="catalogue" class="panel">
            <h2>Find a book</h2>
            <p class="intro">Search by title or pick a category, then borrow a copy.</p>

            <div class="controls">
                <div class="field">
                    <label for="search-input">Search by title</label>
                    <input type="text" id="search-input" placeholder="e.g. JavaScript">
                </div>
                <div class="field">
                    <label for="category-filter">Category</label>
                    <select id="category-filter">
                        <option value="All">All categories</option>
                        <option value="IT">IT</option>
                        <option value="Business">Business</option>
                        <option value="Science">Science</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>
            </div>

            <!-- Book cards are created here by app.js -->
            <div id="book-list" class="book-grid" aria-live="polite"></div>
        </section>

        <!-- Add Book form -->
        <section id="add-book" class="panel">
            <h2>Add a book</h2>
            <p class="intro">Fill in every field to add a book to the catalogue.</p>

            <form id="add-book-form" novalidate>
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title">
                </div>
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author">
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">Choose a category</option>
                        <option value="IT">IT</option>
                        <option value="Business">Business</option>
                        <option value="Science">Science</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>
                <div class="field">
                    <label for="copies">Copies Available</label>
                    <input type="number" id="copies" name="copies" min="0" step="1">
                </div>

                <p id="form-message" class="form-message" role="alert"></p>

                <button type="submit" class="btn">Add book</button>
            </form>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BIT225 Advanced Web Technologies, Assignment 2</p>
            <p>Oscar Sintim &middot; 400622039145</p>
        </div>
    </footer>

    <!-- data.js must load before app.js because app.js uses the books array -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
